<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | strip | escape }}">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <script src="{{ '/js/site.js' | relative_url }}" defer></script>
  {% if page.math %}
  <!-- Renders equations written as $$ ... $$ (only on pages with "math: true") -->
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body{% if page.layout == 'post' %} class="is-post"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="container">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="{{ '/research.html' | relative_url }}"{% if page.url == '/research.html' %} aria-current="page"{% endif %}>Research</a></li>
          <li><a href="{{ '/blog.html' | relative_url }}"{% if page.url == '/blog.html' or page.layout == 'post' %} aria-current="page"{% endif %}>Blog</a></li>
        </ul>
      </nav>
    </header>

    <main id="main">
{{ content }}
    </main>
  </div>
</body>
</html>
