---
layout: default
---
<div class="post-layout">
  <!-- Contents: filled in by js/post.js from the post's ## headings.
       Turn off for one post with "toc: false" in its top section. -->
  <nav class="toc" aria-label="Contents"{% if page.toc == false %} data-enabled="false"{% endif %}></nav>

  <article class="post" id="post">
    <header>
      <a class="back-link" href="{{ '/blog.html' | relative_url }}">← All posts</a>
      <h1>{{ page.title }}</h1>
      <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.summary %}<p class="post-summary">{{ page.summary }}</p>{% endif %}
    </header>

    <div class="post-body">
{{ content }}
    </div>
  </article>
</div>

<script src="{{ '/js/post.js' | relative_url }}" defer></script>
